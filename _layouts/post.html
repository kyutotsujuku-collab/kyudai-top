---
layout: default
---
<div class="post-hero"><div class="wrap narrow">
  <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%Y年%-m月%-d日" }}</time>
  <h1>{{ page.title }}</h1>
</div></div>
<section><div class="wrap narrow post-body">
{{ content }}
<div class="post-nav">
  <span>{% if page.previous %}<a href="{{ page.previous.url }}">← {{ page.previous.title }}</a>{% endif %}</span>
  <span>{% if page.next %}<a href="{{ page.next.url }}">{{ page.next.title }} →</a>{% endif %}</span>
</div>
<p style="margin-top:32px"><a href="/news/" style="color:var(--navy)">お知らせ一覧へ</a></p>
</div></section>
