<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}｜九大突破塾</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
.post-hero{background:var(--navy);color:var(--navy-ink);padding:56px 0 48px}
.post-hero time{display:block;font-size:.85rem;letter-spacing:.14em;opacity:.8;margin-bottom:10px}
.post-hero h1{font-size:clamp(1.6rem,3vw,2.2rem)}
.post-body p{margin-bottom:1.6em}.post-body ul{margin:0 0 1.6em 1.2em}.post-body li{margin-bottom:.5em}
.post-body h2{font-size:1.25rem;margin:2em 0 .8em}.post-body a{color:var(--navy);text-decoration:underline}
.post-nav{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding-top:24px;margin-top:48px;font-size:.92rem}
.post-nav a{text-decoration:none;color:var(--navy)}
.news-list{list-style:none;max-width:680px;margin:0 auto}
.news-list li{display:grid;grid-template-columns:7.5em 1fr;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.news-list time{color:var(--ink2);font-size:.9rem}.news-list a{text-decoration:none;font-weight:500}.news-list a:hover{text-decoration:underline}
.news-list .ex{display:block;font-size:.88rem;color:var(--ink2);font-weight:400;margin-top:4px}
@media (max-width:820px){.news-list li{grid-template-columns:1fr;gap:2px}}
</style>
</head>
<body>
<header>
  <div class="wrap hd">
    <a class="brand" href="/"><img src="/assets/logo.jpg" alt=""><span>九大突破塾<small>大学受験・トップ高校受験 専門塾</small></span></a>
    <button class="menu-btn" onclick="document.querySelector('nav').classList.toggle('open')" aria-label="メニュー">メニュー</button>
    <nav><ul>
      <li class="nav-drop"><a href="/#courses">コース</a><ul><li><a href="/kisotsu/">既卒生</a></li><li><a href="/kou3/" aria-current="page">高３</a></li><li><a href="/kou2/">高２</a></li><li><a href="/kou1/">高１</a></li><li><a href="/chugaku-koritsu/">公立中学生</a></li><li><a href="/chugaku-shiritsu/">私立中学生</a></li></ul></li>
      <li><a href="/#results">合格実績</a></li>
      <li><a href="/ryokin/">料金</a></li>
      <li><a href="/about/">私たちについて</a></li>
      <li><a href="/news/">お知らせ</a></li>
      <li><a href="/blog/">ブログ</a></li>
      <li><a href="/contact/">お問い合わせ</a></li>
    </ul></nav>
  </div>
</header>
{{ content }}
<footer id="contact">
  <div class="wrap ft">
    <div>
      <a class="brand" href="/"><img src="/assets/logo.jpg" alt=""><span>九大突破塾</span></a>
      <address>福岡市城南区別府６丁目２ー４１<br><a href="tel:0927754780">092-775-4780</a><br><a href="mailto:kyutotsujuku@gmail.com">kyutotsujuku@gmail.com</a></address>
    </div>
    <div>
      <p>「絶対に合格する」と決めた人からのご連絡をお待ちしています。</p>
      <a class="btn2" href="/contact/">お問い合わせページへ</a>
    </div>
  </div>
  <p class="copy">© 2019 九大突破塾</p>
</footer>
<script src="/assets/motion.js" defer></script>
</body>
</html>
