<title>ページが見つかりません | 九大突破塾</title>
<script>
// 旧Wix時代のURLを新ページへ転送
var map = {
  "/複製-高校生": "/kisotsu/", "/services-2": "/kou3/", "/複製-高": "/kou2/", "/複製-高校生-1": "/kou1/",
  "/複製-既卒生": "/chugaku-koritsu/", "/複製-公立中学生": "/chugaku-shiritsu/",
  "/料金": "/ryokin/", "/about-1": "/about/", "/contact-8": "/contact/", "/blank": "/news/", "/news": "/news/"
};
var path = decodeURIComponent(location.pathname).replace(/\/$/, "");
if (map[path]) location.replace(map[path]);
else if (path.indexOf("/news/") === 0) location.replace("/news/");
</script>
